name Deploy

on [push]

jobs
  build

    runs-on ubuntu-latest

    steps
    - uses actionscheckout@v1

    - name Copy repository contents via scp
      uses appleboyscp-action@master
      env
        HOST ${{ secrets.HOST }}
        USERNAME ${{ secrets.USERNAME }}
        PORT ${{ secrets.PORT }}
        KEY ${{ secrets.SSHKEY }}
      with
        source .
        target "/home/biglittlebashes/public_html"

    - name Executing remote command
      uses appleboyssh-action@master
      with
        host ${{ secrets.HOST }}
        USERNAME ${{ secrets.USERNAME }}
        PORT ${{ secrets.PORT }}
        KEY ${{ secrets.SSHKEY }}
        script ls