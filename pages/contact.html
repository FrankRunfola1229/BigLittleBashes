    <!--                             FORM                                    -->
    <!--*********************************************************************-->



    <div style="margin-top:5rem;"></div>

    <div class="containerContact cardShadow">

        <div class="wrap-contact100">

            <form id="contact-form" role="form">
                <span class="contact100-form-title">
                    Contact Us
                </span>

                <div class="wrap-input100 validate-input mt-4">
                    <label for="name">Name *</label>
                    <input id="name" type="text" name="name" class="form-control" placeholder="Harry Potter *" required="required" data-error="Name is required.">
                    <div class="help-block with-errors"></div>
                </div>

                <div class="wrap-input100 validate-input">
                    <label for="email">Email *</label>
                    <input id="email" type="email" name="email" class="form-control" placeholder="HarryPotter@Hogwarts.edu *" required="required" data-error="Valid email is required.">
                    <div class="help-block with-errors"></div>
                </div>

                <div class="wrap-input100 validate-input">
                    <label for="message">Message *</label>
                    <textarea id="message" name="message" class="form-control" placeholder="Let's Party!*" rows="4" required="required" data-error="Enter a message."></textarea>
                    <div class="help-block with-errors"></div>
                </div>

                <div class="wrap-input100 validate-input">
                    <label for="message">Phone *</label>
                    <input id="phone" name="phone" class="form-control" placeholder="716-555-1234 *" required="required" data-error="Enter Phone Number.">
                    <div class="help-block with-errors"></div>
                </div>

                <div class="control-group">
                    <label>*What is 2+2? (Anti-spam)</label>
                    <input id="human" name="human" class="form-control" placeholder="Type Here" required="required" data-error="Do some math!">
                    <div class="help-block with-errors"></div>
                </div>

                <br>

                <div class="form-group pb-2">
                    <button type="submit" class="btn btn-primary btn-xl">
                        Send
                    </button>
                </div>
            </form>

            <div id="status" class="container text-center my-4 w-100">
                <!--  JAVSCRIPT WILL POPULATE WITH FETCH CALL TO WEB SERVER MAIL.PHP file  -->
            </div>
        </div>
    </div>
